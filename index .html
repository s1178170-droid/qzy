<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f7fa">
  <title>大自由选区</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232e6480'/%3E%3Cg fill='none' stroke='white' stroke-width='5'%3E%3Crect x='13' y='13' width='15' height='15' rx='3'/%3E%3Crect x='36' y='13' width='15' height='15' rx='3'/%3E%3Crect x='13' y='36' width='15' height='15' rx='3'/%3E%3Crect x='36' y='36' width='15' height='15' rx='3'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root{--ink:#19394c;--muted:#718695;--line:#d8e3ea;--bg:#f3f7fa;--card:#fff;--blue:#356f8d;--blue2:#dfeef6;--green:#247c62;--danger:#b44842;--shadow:0 10px 28px rgba(38,73,94,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px}
    button,input,select{font:inherit} button{cursor:pointer} .app{max-width:1180px;margin:auto;padding:28px 24px 72px}
    .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:12px 2px 22px}.eyebrow{color:#438a70;font-size:14px;font-weight:700;letter-spacing:.12em}.hero h1{margin:5px 0 6px;font-size:42px;letter-spacing:.03em}.subtitle{color:var(--muted)}
    .icon-btn{border:0;background:#e6f0ed;color:#315e51;width:42px;height:42px;border-radius:50%;font-size:19px}.summary{display:flex;gap:28px;flex-wrap:wrap;margin:5px 0 22px}.summary strong{font-size:28px;margin-left:8px;color:#2d6682}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.ghost{border:1px solid transparent;border-radius:999px;padding:10px 17px;background:#e7eeec;color:#687b78}.tab.active{background:var(--green);color:white}.ghost{background:white;border-color:var(--line);color:var(--ink)}
    .legend{display:flex;gap:16px;color:var(--muted);font-size:14px}.legend i{display:inline-block;width:17px;height:17px;border:2px solid #8fb0c4;border-radius:5px;vertical-align:-3px;margin-right:5px}.legend i.on{background:#4c819d;border-color:#4c819d}
    .search-entry{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:17px 20px;margin:22px 0;cursor:pointer}.search-entry .magnify{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#e6f0f6;font-size:23px}.search-entry b{display:block}.search-entry small{color:var(--muted)}.search-entry .go{margin-left:auto;font-size:26px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.zone-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 2px 0 rgba(46,100,128,.02);transition:.18s;cursor:pointer}.zone-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .zone-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.zone-icon{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:#e8f1f6;font-size:28px}.location{color:var(--muted);font-size:14px}.zone-card h2{font-size:23px;margin:18px 0 8px}.leaders{color:var(--muted);min-height:24px}.grade{margin-top:19px}.grade-line{display:flex;justify-content:space-between;color:#617d8f}.grade-line strong{color:#2e6682;font-size:20px}.seat-boxes{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;min-height:23px}.seat{width:24px;height:24px;border:2px solid #9bb9cb;border-radius:7px}.seat.used{background:#4e839f;border-color:#4e839f}.closed{font-size:14px;color:#a06b68}.card-foot{border-top:1px solid #e3eaee;margin-top:20px;padding-top:16px;display:flex;justify-content:space-between;color:#456d85}
    .overlay{position:fixed;inset:0;background:rgba(14,32,43,.52);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:18px}.overlay.show{display:flex}.modal{width:min(920px,100%);max-height:92vh;overflow:auto;background:white;border-radius:26px;padding:26px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal.small{width:min(620px,100%)}
    .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;position:sticky;top:-26px;background:#fff;padding:4px 0 14px;z-index:2}.modal h2{margin:0;font-size:27px}.close{border:0;background:transparent;color:#718595;font-size:29px}.meta{color:var(--muted);margin-top:6px}.capacity-row{display:flex;gap:28px;margin:18px 0;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4b819e;margin-right:7px}.dot.senior{background:#8a6e91}
    .grade-switch{display:grid;grid-template-columns:1fr 1fr;background:#f0f2f3;border-radius:14px;padding:5px;margin:18px 0}.grade-switch button{border:0;background:transparent;padding:12px;border-radius:11px;color:#718595}.grade-switch button.on{background:white;color:var(--ink);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.class-cell{border:1px solid #d6e1e8;background:#f5f8fa;border-radius:13px;padding:12px;text-align:center;color:#708594}.class-cell.has{background:#4e839f;color:#fff;border-color:#4e839f}.class-cell.current{outline:3px solid #b5d5e5}.class-cell strong{display:block;font-size:20px;margin-top:3px}
    .form-row{display:grid;grid-template-columns:1fr 1.25fr auto;gap:10px;margin:18px 0 8px}.control{width:100%;border:1px solid #d5e1e7;border-radius:12px;padding:12px 13px;background:white;color:var(--ink)}.primary{border:0;border-radius:12px;background:#2f718e;color:white;padding:12px 20px;font-weight:700}.primary:disabled{opacity:.45;cursor:not-allowed}.quota-tip{background:#eaf4fa;color:#3b6d87;border-radius:13px;padding:13px 15px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .rosters{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.roster-panel{background:#f5f8fa;border-radius:17px;padding:17px}.roster-title{font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between}.person{display:flex;justify-content:space-between;align-items:center;gap:8px;background:white;border:1px solid #dce6eb;border-radius:10px;padding:9px 10px;margin-top:8px}.tag{display:inline-block;border-radius:7px;background:#dcecf5;color:#396c87;font-size:13px;padding:3px 7px;margin-right:7px}.delete{border:0;background:transparent;color:var(--danger)}.empty{color:#97a6af;padding:14px 0;text-align:center}
    .search-controls{display:grid;grid-template-columns:1fr 210px;gap:10px;margin:15px 0}.results .zone-result{border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.result-head{display:flex;justify-content:space-between;gap:12px}.result-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.result-group{background:#f5f8fa;border-radius:12px;padding:12px}.result-group h4{margin:0 0 8px}.result-person{padding:5px 0}
    .admin-section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.admin-section h3{margin:0 0 13px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:14px;margin-bottom:5px}.field.full{grid-column:1/-1}.manager{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4ebef;padding:10px 0}.manager:last-child{border-bottom:0}.subtle{color:var(--muted);font-size:14px}.danger-link{margin-top:30px;color:#8c9aa3;font-size:13px;text-align:right;cursor:pointer}.danger-box{display:none;background:#fff3f2;border:1px solid #edd1ce;border-radius:15px;padding:15px;margin-top:10px}.danger-box.show{display:block}.danger{background:var(--danger)}.notice{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#173848;color:white;padding:11px 17px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.notice.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:720px){.app{padding:18px 14px 55px}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.zone-card{border-radius:20px;padding:19px}.modal{padding:21px 17px;border-radius:24px}.modal-head{top:-21px}.form-row{grid-template-columns:1fr}.rosters,.result-columns,.admin-grid{grid-template-columns:1fr}.search-controls{grid-template-columns:1fr}.class-grid{grid-template-columns:repeat(3,1fr)}.summary strong{font-size:24px}}
    body{font-size:15px}.app{padding-bottom:115px}.hero h1{font-size:30px}.zone-card h2{font-size:19px;margin:12px 0 6px}.summary strong{font-size:24px}.zone-card{padding:18px;border-radius:19px}.zone-icon{width:44px;height:44px;font-size:24px;border-radius:13px}.grade{margin-top:14px}.grade-line strong{font-size:17px}.modal h2{font-size:22px}.modal h3{font-size:17px}.class-cell strong{font-size:18px}.seat{width:21px;height:21px;border-radius:6px}.card-foot{margin-top:15px;padding-top:12px}.search-entry{margin:16px 0;padding:13px 16px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.bottom-nav button{flex:1;max-width:240px;background:transparent;border:0;color:var(--muted);padding:5px;font-size:14px}.bottom-nav button.active{color:var(--green);font-weight:700}.bottom-nav span{display:block;font-size:22px;margin-bottom:3px}.overlay{padding-bottom:calc(90px + env(safe-area-inset-bottom))}.modal{max-height:calc(100dvh - 125px)}.profile-action{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#f5f8fa;border-radius:13px;padding:15px;margin-top:12px;color:var(--ink)}.profile-name{font-size:23px;font-weight:700;margin-top:12px}.demo-note{background:#eef5f9;border-radius:12px;padding:13px;line-height:1.6;color:#617d8f;margin-top:16px}
    @media(max-width:720px){.app{padding:14px 14px 115px}.hero{padding-bottom:15px}.hero h1{font-size:27px}.subtitle,.leaders,.meta{font-size:14px}.zone-card{padding:16px}.summary{gap:20px;margin-bottom:17px}.summary strong{font-size:23px}.zone-card h2{font-size:19px}.tab{padding:8px 12px;font-size:14px}.toolbar{gap:12px}.grid{gap:14px}.modal h2{font-size:21px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="hero"><div><div class="eyebrow">全园活动</div><h1>大自由选区</h1><div class="subtitle">查看余位 · 选择班级 · 填写名单</div></div><button class="icon-btn" id="adminBtn" aria-label="管理设置">⚙</button></header>
    <section class="summary"><div>中班余位 <strong id="middleLeft">163</strong></div><div>大班余位 <strong id="seniorLeft">182</strong></div></section>
    <div class="toolbar"><div class="tabs" id="tabs"></div><div class="legend"><span><i></i>空位</span><span><i class="on"></i>已报名</span></div></div>
    <div class="search-entry" id="rosterBtn"><span class="magnify">⌕</span><span><b>全部名单与幼儿查找</b><small>按姓名或班级快速找到所在区域</small></span><span class="go">›</span></div>
    <section class="grid" id="zoneGrid"></section>
  </main>
  <nav class="bottom-nav" aria-label="主要功能"><button id="navZones" class="active"><span>▦</span>选区</button><button id="navFind"><span>⌕</span>查找</button><button id="navMe"><span>♙</span>我的</button></nav>
  <div class="overlay" id="meOverlay"><section class="modal small" role="dialog" aria-modal="true"><div class="modal-head"><h2>我的</h2><button class="close" data-close="meOverlay">×</button></div><div id="meContent"></div></section></div>

  <div class="overlay" id="zoneOverlay"><section class="modal" role="dialog" aria-modal="true"><div id="zoneModal"></div></section></div>
  <div class="overlay" id="rosterOverlay"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>全部名单</h2><div class="meta">按姓名或完整班级查找幼儿所在区域</div></div><button class="close" data-close="rosterOverlay">×</button></div><div class="search-controls"><input class="control" id="searchName" placeholder="输入幼儿姓名或班级"><select class="control" id="searchClass"></select></div><div class="subtle" id="resultSummary"></div><div class="results" id="rosterResults"></div></section></div>
  <div class="overlay" id="adminOverlay"><section class="modal small" role="dialog" aria-modal="true"><div id="adminModal"></div></section></div>
  <div class="notice" id="notice"></div>

  <script>
  (()=>{
    const KEY='freeChoiceGardenHtmlV1', USER='freeChoiceGardenOwnerV1';
    const cn=['一','二','三','四','五','六'];
    const classes=['全部班级',...cn.map(x=>'中'+x+'班'),...cn.map(x=>'大'+x+'班')];
    const zones=[
      ['3','室内科创区','中一班','AI体验坊','陈冬莹 黄乐萍',7,7,'🤖'],['4','室内科创区','中三班','纸趣工坊','朱嘉纯 韩菊琴',7,6,'📄'],['5','室内科创区','中六班','中草药坊','毛嘉惠 王泽芬',7,6,'🌿'],['6','室内科创区','大一班','奇妙声音探究坊','程海燕 郑金娥',7,6,'🎵'],['7','室内科创区','大二班','拆卸重组','张宁 张红萍',7,7,'🔧'],['8','室内科创区','大三班','非遗工坊','陈雅榕 李燕',7,6,'🧵'],['9','室内科创区','大四班','智探科学坊','李靓媛 肖晓纯',7,6,'🔬'],['10','室内科创区','大五班','多米诺乐园','袁艳红 赵玉英',7,6,'🧩'],['11','室内科创区','大六班','巧手工程坊','夏艺匀 赵应能',7,6,'🏗️'],
      ['16','户外及公共空间','沙水区','沙水乐园（微建构、微工程）','谢天虹 陈满玉',7,8,'🏖️'],['17','户外及公共空间','门口水池','水趣世界','余丽珍 卢丽春',6,9,'💧'],['18','户外及公共空间','4楼玻璃房','3D打印区','彭舒颖 袁崧',6,6,'🖨️'],['19','户外及公共空间','4楼玻璃房','乐高编程','张强 张绪言',4,8,'🤖'],['20','户外及公共空间','餐厅','节气美食坊','李豫苏 黄月瑟',8,6,'🍲'],['21','户外及公共空间','美术室外','磁力建构','叶诗雅 张洋楠',8,6,'🧲'],['22','户外及公共空间','操场','红砖梦工厂','杨丛丛 夏梓轩',7,8,'🧱'],['23','户外及公共空间','美术室','木工坊','许妍卉 郭贵林',0,12,'🪵'],['24','户外及公共空间','美术室','陶泥创作区','白薇 王诗洋',7,8,'🏺'],['25','户外及公共空间','美术室','地貌乐园','黎懿贤 刘秋兰',6,9,'⛰️'],['26','户外及公共空间','音乐厅','服装设计区','叶丽音 吴紫玲',7,8,'👗'],['27','户外及公共空间','小木屋','自然工坊','周赐琪 鲁丽玉',7,8,'🍃'],['28','户外及公共空间','1楼玻璃门前厅','趣玩轨道','王洋 杨希',6,8,'🚂'],['29','户外及公共空间','3楼功能室','奇趣光影','王伟文 刘慧茹',8,6,'💡'],['30','户外及公共空间','四楼楼顶','沙水建构（水渠建构等）','范杰莉 王静/古松江',7,7,'🌊'],['31','户外及公共空间','家长观礼架空层','阿基米德建构游戏','胡洁 刘宴余',6,9,'⚙️']
    ].map(x=>({id:x[0],group:x[1],location:x[2],title:x[3],leaders:x[4],middle:x[5],senior:x[6],icon:x[7]}));
    let ownerId=localStorage.getItem(USER); if(!ownerId){ownerId='u_'+Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem(USER,ownerId)}
    let state=load(),active='全部',selectedZone=null,grade='middle',classNo=1,isAdmin=sessionStorage.getItem('freeChoiceAdmin')==='1';
    function fresh(){return{zones:JSON.parse(JSON.stringify(zones)),registrations:[],managers:[{id:'m1',name:'首位管理员'}],updatedAt:Date.now()}}
    function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.zones)&&Array.isArray(x.registrations))return x}catch(e){}return fresh()}
    function save(){state.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(state));render();if(selectedZone)openZone(selectedZone,false)}
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const roster=(z,g)=>state.registrations.filter(r=>r.zoneId===z.id&&r.grade===g);
    const label=(g,n)=>(g==='middle'?'中':'大')+cn[n-1]+'班';
    function quota(cap,list,n){cap=Math.max(0,+cap||0);const own=list.filter(r=>r.classNo===n).length,totalLeft=Math.max(0,cap-list.length);if(!totalLeft)return 0;if(cap<6)return Math.max(0,Math.min(1-own,totalLeft));const base=Math.floor(cap/6);const reservedOthers=cn.reduce((sum,_,i)=>sum+(i===n-1?0:Math.max(0,base-list.filter(r=>r.classNo===i+1).length)),0);return Math.max(0,totalLeft-reservedOthers)}
    function rule(cap){cap=Math.max(0,+cap||0);if(!cap)return'该年级不开放';if(cap<6)return`共 ${cap} 个名额，每班最多 1 人，先到先得`;const b=Math.floor(cap/6),e=cap%6;return e?`每班保留 ${b} 个名额，另有 ${e} 个共享名额先到先得`:`每班 ${b} 个名额，不占用其他班名额`}
    function seats(cap,used){if(!cap)return'<span class="closed">未开放</span>';return Array.from({length:cap},(_,i)=>`<i class="seat ${i<used?'used':''}"></i>`).join('')}
    function notify(t){const n=document.getElementById('notice');n.textContent=t;n.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),1800)}
    function render(){
      const groups=['全部','室内科创区','户外及公共空间'];document.getElementById('tabs').innerHTML=groups.map(g=>`<button class="tab ${g===active?'active':''}" data-group="${g}">${g}</button>`).join('');
      const ml=state.zones.reduce((a,z)=>a+Math.max(0,z.middle-roster(z,'middle').length),0),sl=state.zones.reduce((a,z)=>a+Math.max(0,z.senior-roster(z,'senior').length),0);document.getElementById('middleLeft').textContent=ml;document.getElementById('seniorLeft').textContent=sl;
      const list=active==='全部'?state.zones:state.zones.filter(z=>z.group===active);document.getElementById('zoneGrid').innerHTML=list.map(z=>{const m=roster(z,'middle').length,s=roster(z,'senior').length;return`<article class="zone-card" data-zone="${z.id}"><div class="zone-top"><div class="zone-icon">${esc(z.icon)}</div><div class="location">⌾ ${esc(z.location)}</div></div><h2>${esc(z.title)}</h2><div class="leaders">负责人：${esc(z.leaders)}</div><div class="grade"><div class="grade-line"><span>中班</span><strong>${z.middle?'余 '+(z.middle-m)+' 位':'未开放'}</strong></div><div class="seat-boxes">${seats(z.middle,m)}</div></div><div class="grade"><div class="grade-line"><span>大班</span><strong>${z.senior?'余 '+(z.senior-s)+' 位':'未开放'}</strong></div><div class="seat-boxes">${seats(z.senior,s)}</div></div><div class="card-foot"><span>名单 / 报名</span><span>↗</span></div></article>`}).join('');
    }
    function classStatus(z,g){const list=roster(z,g);return cn.map((x,i)=>{const c=list.filter(r=>r.classNo===i+1).length;return`<div class="class-cell ${c?'has':''} ${classNo===i+1?'current':''}" data-class="${i+1}">${label(g,i+1)}<strong>${c} 人</strong></div>`}).join('')}
    function rosterPanel(z,g){const list=roster(z,g);return`<div class="roster-panel"><div class="roster-title"><span><i class="dot ${g==='senior'?'senior':''}"></i>${g==='middle'?'中班':'大班'}名单</span><span>${list.length}/${z[g]}</span></div>${list.length?list.map(r=>`<div class="person"><span><i class="tag">${label(g,r.classNo)}</i>${esc(r.name)}</span>${r.ownerId===ownerId||isAdmin?`<button class="delete" data-remove="${r.id}">删除</button>`:''}</div>`).join(''):'<div class="empty">还没有名单</div>'}</div>`}
    function openZone(id,show=true){selectedZone=id;const z=state.zones.find(x=>x.id===id);if(!z)return;const list=roster(z,grade),available=quota(z[grade],list,classNo);document.getElementById('zoneModal').innerHTML=`<div class="modal-head"><div><h2>${esc(z.title)}</h2><div class="meta">📍 ${esc(z.location)}　·　负责人：${esc(z.leaders)}</div></div><button class="close" data-close="zoneOverlay">×</button></div><div class="capacity-row"><span><i class="dot"></i>中班 ${roster(z,'middle').length}/${z.middle}</span><span><i class="dot senior"></i>大班 ${roster(z,'senior').length}/${z.senior}</span></div><div class="grade-switch"><button data-grade="middle" class="${grade==='middle'?'on':''}">中班报名</button><button data-grade="senior" class="${grade==='senior'?'on':''}">大班报名</button></div><h3>${grade==='middle'?'中班':'大班'}各班报名情况</h3><div class="class-grid">${classStatus(z,grade)}</div><div class="form-row"><select class="control" id="classSelect">${cn.map((x,i)=>`<option value="${i+1}" ${classNo===i+1?'selected':''}>${label(grade,i+1)}</option>`).join('')}</select><input class="control" id="childName" maxlength="12" placeholder="请输入幼儿姓名"><button class="primary" id="joinBtn" ${available?'':'disabled'}>${available?'确认加入':'本班名额暂满'}</button></div><div class="quota-tip"><span>${rule(z[grade])}</span><b>本班还能填 ${available} 人</b></div><div class="rosters">${rosterPanel(z,'middle')}${rosterPanel(z,'senior')}</div>`;if(show)document.getElementById('zoneOverlay').classList.add('show')}
    function addRegistration(){const z=state.zones.find(x=>x.id===selectedZone),name=document.getElementById('childName').value.trim();if(!name)return notify('请填写幼儿姓名');const list=roster(z,grade);if(quota(z[grade],list,classNo)<=0)return notify('该班当前没有可用名额');if(state.registrations.some(r=>r.zoneId===z.id&&r.grade===grade&&r.classNo===classNo&&r.name===name))return notify('该幼儿已在本区名单中');state.registrations.push({id:'r_'+Date.now()+Math.random().toString(36).slice(2),zoneId:z.id,grade,classNo,name,ownerId,createdAt:Date.now()});save();notify('报名成功')}
    function removeRegistration(id){const r=state.registrations.find(x=>x.id===id);if(!r||(!isAdmin&&r.ownerId!==ownerId))return notify('只能删除自己填写的数据');if(confirm(`确认删除 ${label(r.grade,r.classNo)} ${r.name}？`)){state.registrations=state.registrations.filter(x=>x.id!==id);save();notify('已删除')}}
    function openRoster(){document.getElementById('searchClass').innerHTML=classes.map(x=>`<option>${x}</option>`).join('');document.getElementById('searchName').value='';document.getElementById('searchClass').value='全部班级';renderRoster();document.getElementById('rosterOverlay').classList.add('show')}
    function renderRoster(){const q=document.getElementById('searchName').value.trim().toLowerCase(),c=document.getElementById('searchClass').value;let people=0;const cards=[];state.zones.forEach(z=>{const filter=g=>roster(z,g).filter(r=>(!q||r.name.toLowerCase().includes(q)||label(g,r.classNo).includes(q))&&(c==='全部班级'||label(g,r.classNo)===c));const m=filter('middle'),s=filter('senior');if((q||c!=='全部班级')&&!m.length&&!s.length)return;people+=m.length+s.length;cards.push(`<div class="zone-result"><div class="result-head"><b>${esc(z.icon)} ${esc(z.title)}</b><span>${m.length+s.length}人</span></div><div class="subtle">${esc(z.location)} · 负责人：${esc(z.leaders)}</div><div class="result-columns"><div class="result-group"><h4>中班名单 ${q||c!=='全部班级'?m.length:m.length+'/'+z.middle}</h4>${m.length?m.map(r=>`<div class="result-person"><i class="tag">${label('middle',r.classNo)}</i>${esc(r.name)}</div>`).join(''):'<div class="subtle">暂无名单</div>'}</div><div class="result-group"><h4>大班名单 ${q||c!=='全部班级'?s.length:s.length+'/'+z.senior}</h4>${s.length?s.map(r=>`<div class="result-person"><i class="tag">${label('senior',r.classNo)}</i>${esc(r.name)}</div>`).join(''):'<div class="subtle">暂无名单</div>'}</div></div></div>`)});const searched=q||c!=='全部班级';document.getElementById('resultSummary').textContent=searched?`找到 ${people} 人，分布在 ${cards.length} 个区`:`共 ${state.zones.length} 个区，已报名 ${state.registrations.length} 人`;document.getElementById('rosterResults').innerHTML=cards.join('')||'<div class="empty">没有找到符合条件的幼儿</div>'}
    function openAdmin(){
      if(!isAdmin){const code=prompt('请输入管理员访问码');if(code!=='2468')return code!==null&&notify('访问码不正确');isAdmin=true;sessionStorage.setItem('freeChoiceAdmin','1')}
      renderAdmin();document.getElementById('adminOverlay').classList.add('show')
    }
    function renderAdmin(){const z=state.zones[0];document.getElementById('adminModal').innerHTML=`<div class="modal-head"><div><h2>管理中心</h2><div class="meta">当前 ${state.managers.length} / 4 位管理员</div></div><button class="close" data-close="adminOverlay">×</button></div><div class="admin-section"><h3>区域基本信息</h3><select class="control" id="adminZone">${state.zones.map((x,i)=>`<option value="${i}">${esc(x.title)}</option>`).join('')}</select><div id="zoneEditor"></div></div><div class="admin-section"><h3>管理员</h3><div id="managerList">${state.managers.map(m=>`<div class="manager"><span>${esc(m.name)}</span><button class="delete" data-manager-remove="${m.id}">移除</button></div>`).join('')}</div><div class="form-row" style="grid-template-columns:1fr auto"><input class="control" id="managerName" maxlength="12" placeholder="新管理员姓名"><button class="primary" id="addManager" ${state.managers.length>=4?'disabled':''}>添加管理员</button></div><div class="subtle">最多4人。需要更换时，先移除旧管理员，再添加新管理员。</div></div><div class="danger-link" id="dangerEntry">活动维护</div><div class="danger-box" id="dangerBox"><b>一键清空全部名单</b><p class="subtle">请输入“确认清空”，此操作无法撤销。</p><div class="form-row" style="grid-template-columns:1fr auto"><input class="control" id="clearText" placeholder="确认清空"><button class="primary danger" id="clearAll">清空名单</button></div></div>`;renderZoneEditor(0)}
    const originalRenderAdmin=renderAdmin;
    renderAdmin=function(){
      originalRenderAdmin();
      const form=document.getElementById('managerName').parentElement;
      form.innerHTML='<button class="primary" id="inviteManager" type="button">邀请管理员</button>';
      form.style.gridTemplateColumns='1fr';
      form.nextElementSibling.textContent='由首位管理员发出邀请，对方打开链接并同意后加入。最多4人，邀请单次使用、24小时有效。';
      const note=document.createElement('div');note.className='demo-note';note.textContent='当前为本机演示版，跨手机邀请授权尚未接通。接入统一后台后才能生成有效邀请链接。';form.parentElement.appendChild(note);
    };
    function setNav(which){document.querySelectorAll('.bottom-nav button').forEach(b=>{b.classList.toggle('active',b.id===which);if(b.id===which)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
    function closePanels(){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'));selectedZone=null}
    function openMe(){
      closePanels();setNav('navMe');const mine=state.registrations.filter(r=>r.ownerId===ownerId);
      document.getElementById('meContent').innerHTML=`<div class="profile-name">${isAdmin?'管理员演示身份':'当前访客'}</div><p class="subtle">我填写了 ${mine.length} 条名单</p><button class="profile-action" id="myListBtn">查看我填写的名单</button><button class="profile-action" id="myAdminBtn">管理设置</button><div class="demo-note">名单保存在本机浏览器。不同手机的数据尚未共享。</div>`;
      document.getElementById('meOverlay').classList.add('show');
    }
    function openMyList(){const list=state.registrations.filter(r=>r.ownerId===ownerId);document.getElementById('meContent').innerHTML='<h3>我填写的名单</h3>'+ (list.length?list.map(r=>{const z=state.zones.find(z=>z.id===r.zoneId);return `<div class="person"><div><b>${esc(r.name)}</b> <i class="tag">${label(r.grade,r.classNo)}</i><div class="subtle">${esc(z?.title||'')} · ${esc(z?.location||'')}</div></div><button class="delete" data-my-remove="${r.id}">删除</button></div>`}).join(''):'<div class="empty">还没有填写名单</div>')}
    document.getElementById('navZones').onclick=()=>{closePanels();setNav('navZones');window.scrollTo({top:0,behavior:'smooth'})};
    document.getElementById('navFind').onclick=()=>{closePanels();setNav('navFind');openRoster()};
    document.getElementById('navMe').onclick=openMe;
    document.addEventListener('click',e=>{if(e.target.id==='myAdminBtn')openAdmin();if(e.target.id==='myListBtn')openMyList();if(e.target.id==='inviteManager')notify('邀请授权需要先接通统一后台');const btn=e.target.closest('[data-my-remove]');if(btn){removeRegistration(btn.dataset.myRemove);openMyList()}if(e.target.closest('[data-close]'))setNav('navZones')});
    function renderZoneEditor(i){const z=state.zones[i];document.getElementById('zoneEditor').innerHTML=`<div class="admin-grid" style="margin-top:13px"><div class="field full"><label>区域名称</label><input class="control" id="eTitle" value="${esc(z.title)}"></div><div class="field"><label>场地</label><input class="control" id="eLocation" value="${esc(z.location)}"></div><div class="field"><label>负责人</label><input class="control" id="eLeaders" value="${esc(z.leaders)}"></div><div class="field"><label>区域图标</label><input class="control" id="eIcon" maxlength="8" value="${esc(z.icon)}"></div><div class="field"><label>中班总人数</label><input class="control" id="eMiddle" type="number" min="0" value="${z.middle}"></div><div class="field"><label>大班总人数</label><input class="control" id="eSenior" type="number" min="0" value="${z.senior}"></div><div class="field full"><div class="subtle">修改人数后，每班可进入人数会自动按六个班平均保留、余位先到先得的规则重新计算。</div><button class="primary" id="saveZone" style="margin-top:12px">保存修改</button></div></div>`}
    function saveZone(){const i=+document.getElementById('adminZone').value,z=state.zones[i],title=document.getElementById('eTitle').value.trim(),location=document.getElementById('eLocation').value.trim(),leaders=document.getElementById('eLeaders').value.trim();if(!title||!location||!leaders)return notify('基本信息不能留空');Object.assign(z,{title,location,leaders,icon:document.getElementById('eIcon').value.trim()||'✦',middle:Math.max(0,+document.getElementById('eMiddle').value||0),senior:Math.max(0,+document.getElementById('eSenior').value||0)});save();renderAdmin();document.getElementById('adminZone').value=i;renderZoneEditor(i);notify('保存成功')}
    document.addEventListener('click',e=>{const t=e.target.closest('[data-group],[data-zone],[data-close],[data-grade],[data-class],[data-remove],[data-manager-remove]');if(t?.dataset.group){active=t.dataset.group;render()}else if(t?.dataset.zone)openZone(t.dataset.zone);else if(t?.dataset.close)document.getElementById(t.dataset.close).classList.remove('show');else if(t?.dataset.grade){grade=t.dataset.grade;openZone(selectedZone,false)}else if(t?.dataset.class){classNo=+t.dataset.class;openZone(selectedZone,false)}else if(t?.dataset.remove)removeRegistration(t.dataset.remove);else if(t?.dataset.managerRemove){if(state.managers.length===1)return notify('至少保留一位管理员');state.managers=state.managers.filter(m=>m.id!==t.dataset.managerRemove);save();renderAdmin();notify('管理员已移除')}});
    document.addEventListener('change',e=>{if(e.target.id==='classSelect'){classNo=+e.target.value;openZone(selectedZone,false)}if(e.target.id==='adminZone')renderZoneEditor(+e.target.value);if(e.target.id==='searchClass')renderRoster()});
    document.addEventListener('input',e=>{if(e.target.id==='searchName')renderRoster()});
    document.addEventListener('click',e=>{if(e.target.id==='joinBtn')addRegistration();if(e.target.id==='saveZone')saveZone();if(e.target.id==='addManager'){const n=document.getElementById('managerName').value.trim();if(!n)return notify('请输入管理员姓名');if(state.managers.length>=4)return notify('最多设置4位管理员');state.managers.push({id:'m_'+Date.now(),name:n});save();renderAdmin();notify('管理员已添加')}if(e.target.id==='dangerEntry')document.getElementById('dangerBox').classList.toggle('show');if(e.target.id==='clearAll'){if(document.getElementById('clearText').value.trim()!=='确认清空')return notify('文字不正确，未清空');if(confirm('确认清空全部报名名单？')){state.registrations=[];save();renderAdmin();notify('全部名单已清空')}}});
    document.getElementById('rosterBtn').onclick=openRoster;document.getElementById('adminBtn').onclick=openAdmin;document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render();notify('数据已更新')}});render();
  })();
  </script>
</body>
</html>
